version: '3.9'

services:
  api:
    build: ./backend
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-flowspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowspace}
      POSTGRES_DB:       ${POSTGRES_DB:-flowspace}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowspace']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
